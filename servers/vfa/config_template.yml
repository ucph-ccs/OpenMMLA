# config_template.yml
# Template configuration file for video frame analyzer pipeline components.
# Fill in or update values as needed for your environment.
VLLMFrameAnalyzer:
  port: 5007 # port number
  workers: 1 # number of workers
  app: <path-to-vllm-frame-analyzer-app> # path to the vllm frame analyzer app

  families: tag36h11  # AprilTag used in experiment, e.g., tag36h11, tag25h9, tagStandard41h12

  backend: <backend_name>  # e.g., gemini, ollama, openai, vllm, qwen, deepseek, llamacpp, grok
  top_p: 0 # top_p for LLM (from 0 to 1) - OPTIONAL: omit if model doesn't support it
  temperature: 0 # temperature for LLM (from 0 to 1) - OPTIONAL: omit if model doesn't support it
  end_to_end: false # whether to use end-to-end mode (true) or two-step mode (false)
  image_detail: "auto"  # Image detail for vision models: "low" (faster, less detail), "high" (slower, more detail), "auto" (model decides)
  prompt_templates_dir: <path-to-prompt-templates-dir>  # either relative to the project directory or absolute path
  apriltag_examples_dir: <path-to-apriltag-examples-dir>  # either relative to the project directory or absolute path

  # Define the actions that you want to classify
  action_definitions:
    Working-Software: "when a person's GAZE is directed at a screen AND their HANDS are actively interacting with digital interface devices (keyboard, mouse, touchscreen)."
    Working-Hardware: "when a person's GAZE is directed at physical components AND their HANDS are directly manipulating these non-screen hardware elements (circuit boards, wires, physical devices)."
    Working-Document: "when a person's GAZE is directed at papers, books, or other physical documents AND their HANDS are interacting with these documents (holding, writing, pointing to content)."
    Communicating: "when a person's GAZE is directed toward another person AND their HANDS are actively gesturing or pointing. This involves direct visual engagement with another person plus active hand movements for communication purposes."
    Observing: "When a person's GAZE is directed at work-related elements (such as laptops, screens, hardware, documents, or another person's work), AND their HANDS are either inactive OR interacting with something unrelated to their gaze target."
    Distracted: "when a person's GAZE is directed at non-work elements (such as personal phones) OR outside of the frame, AND their HANDS are either inactive OR interacting with non-work items."
    Unclear: "when either GAZE or HAND status cannot be confidently determined due to occlusion, ambiguous positioning, or insufficient visibility in the image."
  
  # Supported backends
  ollama:
    api_key: <OLLAMA_API_KEY>
    vlm_base_url: "http://localhost:11434/v1" # base url for vlm
    llm_base_url: "http://localhost:11434/v1" # base url for llm
    vlm_model: "llava:13b" # vlm model name
    llm_model: "llama3.1" # llm model name
    VLMExtraBody: {} # extra body for vlm
    LLMExtraBody: {} # extra body for llm

  vllm:
    api_key: <VLLM_API_KEY>
    vlm_base_url: "http://localhost:8000/v1"
    llm_base_url: "http://localhost:8001/v1"
    vlm_model: "openbmb/MiniCPM-V-2_6"
    llm_model: "microsoft/Phi-3-small-128k-instruct"
    VLMExtraBody: 
      stop_token_ids: [151645, 151643] # stop token ids for MiniCPM-V-2_6
    LLMExtraBody: {}
  
  llamacpp:
    api_key: "sk-no-key-required"
    vlm_base_url: "http://localhost:8001/v1"
    llm_base_url: "http://localhost:8001/v1"
    vlm_model: "ggml-org/SmolVLM-500M-Instruct-GGUF"
    llm_model: "ggml-org/SmolVLM-500M-Instruct-GGUF"
    VLMExtraBody: {}
    LLMExtraBody: {}

  openai:
    api_key: <OPENAI_API_KEY>
    vlm_model: "gpt-4o"
    llm_model: "gpt-4o"

  gemini:
    api_key: <GEMINI_API_KEY>
    vlm_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    llm_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    vlm_model: "gemini-2.0-pro-exp-02-05"
    llm_model: "gemini-2.0-pro-exp-02-05"

  grok:
    api_key: <GROK_API_KEY>
    vlm_base_url: "https://api.x.ai/v1"
    llm_base_url: "https://api.x.ai/v1"
    vlm_model: grok-4-latest 
    llm_model: grok-4-latest

  deepseek:
    api_key: <DEEPSEEK_API_KEY>
    vlm_base_url: "https://api.deepseek.com"
    llm_base_url: "https://api.deepseek.com"
    vlm_model: "deepseek-reasoner"
    llm_model: "deepseek-reasoner"
  
  qwen:
    api_key: <QWEN_API_KEY>
    vlm_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    llm_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    vlm_model: "qwen2.5-72b-instruct"
    llm_model: "qwen2.5-72b-instruct"
  
  zhipuai:
    api_key: <ZHIPU_API_KEY>
    vlm_model: "glm-4.5v"
    llm_model: "glm-4.5v"
  
  intern:
    api_key: <INTERN_API_KEY>
    vlm_base_url: "https://chat.intern-ai.org.cn/api/v1/"
    llm_base_url: "https://chat.intern-ai.org.cn/api/v1/"
    vlm_model: "internvl3.5-241b-a28b"
    llm_model: "internvl3.5-241b-a28b"


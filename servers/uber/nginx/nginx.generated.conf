worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    
    
    upstream infer_service {
        
        server 192.168.3.2:5001 weight=3 max_fails=1 fail_timeout=30s;
        
        keepalive 40;
    }
    

    server {
        listen 8080;
        server_name localhost;

        location / {
            root html;
            index index.html index.htm;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }

        
        
        location /infer {
            proxy_pass http://infer_service;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
        }
        
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        
        application stream_01 {
            live on;
            record off;
        }
        
        application stream_02 {
            live on;
            record off;
        }
        
        application stream_03 {
            live on;
            record off;
        }
        
        application stream_04 {
            live on;
            record off;
        }
        
        application stream_05 {
            live on;
            record off;
        }
        
    }
}
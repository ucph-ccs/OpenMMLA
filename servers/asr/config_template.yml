# config_template.yml
# Template configuration file for audio processing pipeline components.
# Fill in or update values as needed for your environment.

AudioInferer:
  cuda: true # whether to use gpu acceleration, true/false
  backend: nemo # nemo or wespeaker
  port: 5001 # port number
  workers: 1 # number of workers
  app: <path-to-audio-inferer-app> # path to the audio inferer app
  # nemo-specific options
  onnx: false # whether to use onnx runtime for inference, true/false (onnx runtime is faster but less precise)
  model: <nemo-speaker-embedding-model>  # e.g., titanet_large, ecapa_tdnn, etc.
  # wespeaker-specific options (set backend: wespeaker to use)
  # model: w2vbert2_mfa  # chinese, english, campplus, eres2net, vblinkp, vblinkf, w2vbert2_mfa

AudioResampler:
  port: 5002 
  workers: 1 
  app: <path-to-audio-resampler-app> 

SpeechEnhancer:
  cuda: true 
  port: 5003 
  workers: 1  
  app: <path-to-speech-enhancer-app> 

SpeechSeparator:
  cuda: true
  model: <modelscope-speech-separation-model> # e.g., damo/speech_mossformer2_separation_temporal_8k
  model_local: <modelscope-speech-separation-model-local-path>  # e.g., .cache/modelscope/hub/damo/speech_mossformer2_separation_temporal_8k
  port: 5004 
  workers: 1 
  app: <path-to-speech-separator-app> 

SpeechTranscriber:
  cuda: true
  port: 5005 
  workers: 1 
  app: <path-to-speech-transcriber-app> 

  backend: <backend> # azure, local, or dashscope
  azure:
    subscription_key: <azure-subscription-key>
    region: <azure-region>
    language: <azure-language>
    profanity_option: <azure-profanity-option> # raw, masked, removed
    word_level: <bool> # word-level timestamps, true/false
  local:
    model: <model>  # e.g., base.en, small.en, medium.en, large.en for regular Whisper, or whisperx/large-v3, whisperx/medium for WhisperX with word-level timestamps
    language: en  # language code, e.g., en, zh, fr, etc. Set to null for auto-detection
    word_level: <bool>
  dashscope:
    api_key: <dashscope-api-key>  # or set DASHSCOPE_API_KEY environment variable
    model: paraformer-realtime-v2  # paraformer-realtime-v2, qwen3-asr-flash, etc.
    region: intl  # intl (Singapore) or cn (Beijing), endpoint selection for qwen3-asr models
    word_level: <bool>  # word-level timestamps (paraformer only, not supported by qwen3-asr sync mode)
    # paraformer-specific options
    language_hints: [zh, en, ja]  # language hints for multi-language support
    # qwen3-asr-specific options
    language: zh  # single language code, omit for multilingual auto-detection
    enable_itn: false  # inverse text normalization, Chinese and English only

VoiceActivityDetector:
  cuda: true
  onnx: true
  port: 5006 
  workers: 1 
  app: <path-to-voice-activity-detector-app> 

# VFA server stack — frame analyzer (5007).
# Run from the repository root:
#   docker compose -f docker/docker-compose.vfa.yml up -d --build
#
# Requirements on the host: NVIDIA driver + nvidia-container-toolkit.

name: openmmla-vfa

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  frame-analyzer:
    <<: *gpu
    # bounded on purpose: a bad config is not fixed by trying again, and an
    # endless loop only makes the console's status blink as the port comes and goes
    restart: on-failure:3
    build:
      context: ..
      dockerfile: docker/vfa-frame-analyzer/Dockerfile
    image: openmmla/vfa-frame-analyzer
    environment:
      PROJECT_DIR: /project
      CONFIG_PATH: /project/config.yml
    volumes:
      - ../pipelines/vfa-server:/project
      # action schema referenced by config (config/vfa/action_schemas.yml)
      - ../config/vfa:/project/config/vfa:ro
      - ${OPENMMLA_KEY_DIR:-~/.openmmla}:/root/.openmmla:ro
      - hf-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
      # RetinaFace's weights (retina-face keeps them under ~/.deepface)
      - deepface-cache:/root/.deepface
    ports:
      - "5007:5007"
    extra_hosts:
      # lets the config reach a VLM server running natively on the host (the
      # console's MLLM Server card, Ollama) at http://host.docker.internal:<port>/v1
      - "host.docker.internal:host-gateway"

volumes:
  hf-cache:
  torch-cache:
  deepface-cache:

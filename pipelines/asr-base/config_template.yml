# ASR-BASE config_template.yml
# Template for configuring audio, stream, database and server endpoints for the system

# Base: one block per kind of microphone (a table speakerphone, a badge, a
# laptop mic), named as you like. It says how the audio of that kind of
# microphone is processed (whether speakers are recognized, recognition
# thresholds and durations, gain, VAD) and the format the base works in
# (stream_kwargs), whatever the source. Which microphones there are, where
# each one's audio comes from, and what only that source needs, is the Bases
# list below.
Base:
  <Your_Device_Name>:
    asr_scope: individual         # individual = speaker verification + transcription; group = attribute transcript to the session group (no verification)
    speaker_verification: auto    # auto = individual:true, group:false; set true/false to override
    register_duration:            # Seconds to record for registration
    recognize_duration:           # Seconds to record for recognition
    recognize_sp_duration:        # Seconds to record for recognition (with speech separation)
    recognize_threshold:          # Similarity threshold for recognition
    recognize_sp_threshold:       # Similarity threshold for recognition (with speech separation)
    keep_threshold:               # Similarity threshold for keeping identity for speaker border cases (with half-scaled recognition)
    keep_sp_threshold:            # Similarity threshold for keeping identity for speaker border cases (with half-scaled recognition and speech separation)
    rms_threshold:                # Root Mean Square amplitude value threshold for VAD preprocessing
    rms_peak_threshold:           # Peak amplitude value threshold for VAD preprocessing
    update_threshold:             # Similarity threshold for incrementally updating speaker profile
    gain:                         # Volume gain multiplier in decibels for audio preprocessing
    score_amplified:              # Whether to amplify the similarity score of the audio signal based on the energy level
    stream_kwargs:                # the audio as the base works with it, whatever the source
      channels:                   # how many channels (default 1): what a badge or FFmpeg stream sends over udp/tcp (must match), what a MediaMTX stream is decoded to and a replayed file converted to; a pyaudio device's count is read from the device itself (Bases.channel_select keeps one of them)
      rate:                       # Sampling rate in Hz (e.g., 16000 for 16kHz)
      format:                     # Audio format, e.g., int16, float32
      chunk_size:                 # Size of each audio chunk in frames (default to 512)
      buffer_duration:            # Buffer duration in seconds for audio stream
      resample_method:            # Resampling method for audio processing
      timestamp_offset:           # seconds added to every chunk's stamp, for every base of this type: the measured delay of the stream as a negative number (e.g. -0.2); empty = 0, see docs/rtmp_streaming.md#timestamps
  # example 1: external stream (already running; the base pulls read_target, else target)
  # mic-external:
  #   target: rtmp://uber-server.local:1935/asr/mic1
  #   read_target: rtsp://uber-server.local:8554/asr/mic1
  #
  # example 2: managed stream (TUI starts/stops ffmpeg on remote Raspberry Pi via SSH);
  # ffmpeg sends raw PCM to the port of the Bases entry that uses source udp/tcp
  # rpi-mic-1:
  #   ssh_profile: rpi-table-1        # must match a TUI SSH profile name
  #   device: hw:1,0                  # ALSA audio device on the remote machine
  #   target: udp://asr-base.local:5001  # target address (udp://<host>:<port> or tcp://<host>:<port>)
  #   format: s16le                   # PCM sample format (s16le, s32le, f32le); must match stream_kwargs.format (int16, int32, float32)
  #   rate: 16000                     # sample rate in Hz; must match stream_kwargs.rate
  #   channels: 1                     # number of audio channels; must match stream_kwargs.channels
  #   record: true                    # also keep a wav on the Pi under ~/artifacts/streams/capture/<date>/<profile>/audio/
  #
  # example 3: managed microphone published to MediaMTX (AAC); the base pulls it as RTSP
  # rpi-mic-2:
  #   ssh_profile: rpi-table-2
  #   device: hw:1,0
  #   kind: audio                     # audio or video; when omitted: a udp/tcp target or an audio device (hw:, :0) is audio, else the card's default, which on ASR Base is audio
  #   target: rtmp://uber-server.local:1935/asr/mic2
  #   read_target: rtsp://uber-server.local:8554/asr/mic2
  #   record: true

# Bases: one entry per microphone, that is per base process you start. An
# entry says which one it is (id), which kind of microphone it is (base_type,
# a block of Base) and where its audio comes from: the source, and the fields
# that source needs (the Config tab shows only those):
#   pyaudio   source_index: the input device index; channel_select: which channel of a multi-channel device to keep (optional; 'channel' is its old name)
#   udp/tcp   port: the port this base listens on; a badge or an FFmpeg stream of Streams pushes to it
#             host: the address it listens on (default 0.0.0.0, every interface)
#             packet_format: auto (default: the first packet tells), timestamped (a badge: 18-byte header + PCM) or raw (header-less PCM: an FFmpeg stream)
#   stream    source_index: the name of the Streams entry it pulls
#   lsl       source_index: the LSL stream name
#   file      source_index: the file to replay, by its full path (Browse… on the Config tab); the start time comes from its name (<prefix>_<timestamp>.<extension>)
# The card's Base dropdowns offer these entries, and -b names one; you no
# longer type the id or pick the base type at startup.
Bases:
  # one template entry (edit it / use "+ Add Entry" in the TUI). Entries whose
  # id is left as a <...> placeholder are ignored at runtime.
  - id: <base-id>               # base id / identity (string or number; part of base_id {base_type}_{id})
    base_type: <Your_Device_Name>   # which block of Base
    source: pyaudio             # udp / tcp / pyaudio / stream / lsl / file (rtmp is the old name of stream)
    source_index: 0             # see above; not used by udp/tcp
    channel_select: 0           # pyaudio only, optional
    port: 5001                  # udp/tcp only
    host: 0.0.0.0               # udp/tcp only: the address this base listens on
    packet_format: auto         # udp/tcp only: auto, timestamped or raw
 
# synchronizer settings
Synchronizer:
  result_expiry_time: 10        # cleanup timeout (seconds)
  bucket_duration: 3            # time bucket duration (seconds) for synchronized result (default: recognize_duration)
  match_tolerance: 1.5          # matching tolerance (seconds) for incoming result to time buckets (default: ~bucket_duration/2)

# post analyzer settings
# streams settings
# each entry defines an audio stream source. streams with ssh_profile can be started/stopped
# from the TUI Launcher; streams without ssh_profile are treated as external (already running).
Streams:

# Database settings
InfluxDB:
  # Replace <inlfuxdb-example-server> with your actual sever address that runs the InfluxDB server, and the <port>
  # with the actual port number that InfluxDB server is listening to. The default port for InfluxDB is 8086.
  # Replace <influxdb-token> with your actual InfluxDB token, and <org-name> with your actual InfluxDB organization name.
  # =================================================================================
  # e.g., if your InfluxDB server is on uber-server.local machine and its IP address is 192.168.1.12 and listens on 8086,
  # and it has a token named lrn6PxfmD_Sbde1Ke3LL5QOIc-QQJLT9Tw58-Y1pHXWfcsdljWMfwSOJ8F3CP3c20qYPiJ9UL8bSslELPW27lw==
  # and organization named admin, then the following line should be:
  # url: http://uber-server.local:8086
  # token: lrn6PxfmD_Sbde1Ke3LL5QOIc-QQJLT9Tw58-Y1pHXWfcsdljWMfwSOJ8F3CP3c20qYPiJ9UL8bSslELPW27lw==
  # org: admin
  url: http://<influxdb-example-server>:<port>
  token: <influxdb-token>
  org: <org-name>
  bucket: mmla-data

MongoDB:
  url: mongodb://<mongodb-example-server>:<port>
  db: openmmla

# MQTT settings
MQTT:
  # Replace <mqtt-example-server> with your actual sever address that runs the MQTT server, and the <port-number>
  # with the actual port number that MQTT server is listening to. The default port for MQTT is 1883.
  # =================================================================================
  # e.g., if your MQTT server is on uber-server.local machine and its IP address is 192.168.1.12, and it has listening
  # on port 1883, then the following line should be:
  # host: uber-server.local
  # port: 1883
  host: <mqtt-example-server>
  port: <port-number>

# Redis settings
Redis:
  # Replace <redis-example-server> with your actual sever address that runs the Redis server, and the <port-number>
  # with the actual port number that Redis server is listening to. Specify a certain database number you want to use for
  # message queue. The default database number is 0. The default port for Redis is 6379.
  # =================================================================================
  # e.g., if your Redis server is on uber-server.local machine and its IP address is 192.168.1.12, and it has listening
  # on port 6379, then the following line should be:
  # host: uber-server.local
  # port: 6379
  # db: 0
  host: <redis-example-server>
  port: <port-number>
  db: <database-number>

# Gateway (Nginx) settings
# Shared reverse-proxy/load-balancer endpoint that bases connect to. In the
# Server section below, a service may be given either as a bare endpoint name
# (composed against this gateway, e.g. 'infer' -> {scheme}://{host}:{http_port}/infer)
# or as a full URL (used as-is, bypassing the gateway for a direct connection).
Gateway:
  host: <gateway-host>      # nginx load balancer host, e.g. uber-server.local
  http_port: 8080           # nginx HTTP reverse-proxy port
  scheme: http              # http or https

# Server settings
Server:
  # ASR server settings
  # Replace <asr-example-server> with your actual sever address that runs the ASR server or the load balancer
  # that proxy your ASR requests, and the <port> with the port numbers different ASR services listening on
  # or the port number that the load balancer listening on. The default port for ASR services is infer:5001,
  # resample:5002, enhance:5003, separate:5004, transcribe:5005, vad:5006. The default port for load balancer is 8080.
  # =================================================================================
  # e.g., if your ASR server is run on asr-server.local, and you have a load balancer on uber-server.local that proxy
  # your ASR requests, then the following line could be:
  # request ASR services from load balancer:
  # asr:
  #   audio_inferer: http://uber-server.local:8080/infer
  #   audio_resampler: http://uber-server.local:8080/resample
  #   speech_enhancer: http://uber-server.local:8080/enhance
  #   speech_separator: http://uber-server.local:8080/separate
  #   speech_transcriber: http://uber-server.local:8080/transcribe
  #   voice_activity_detector: http://uber-server.local:8080/vad
  #
  # or you can directly request the services from the ASR server:
  # asr:
  #   audio_inferer: http://asr-server.local:5001/infer
  #   audio_resampler: http://asr-server.local:5002/resample
  #   speech_enhancer: http://asr-server.local:5003/enhance
  #   speech_separator: http://asr-server.local:5004/separate
  #   speech_transcriber: http://asr-server.local:5005/transcribe
  #   voice_activity_detector: http://asr-server.local:5006/vad
  asr:
    audio_inferer: http://<asr-example-server>:<port>/infer
    audio_resampler: http://<asr-example-server>:<port>/resample
    speech_enhancer: http://<asr-example-server>:<port>/enhance
    speech_separator: http://<asr-example-server>:<port>/separate
    speech_transcriber: http://<asr-example-server>:<port>/transcribe
    voice_activity_detector: http://<asr-example-server>:<port>/vad

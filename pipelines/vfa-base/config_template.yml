# VFA-BASE config_template.yml
# Template configuration file for AprilTag detection, image capture, camera calibration, and server communication

Base:
  # AprilTags settings
  tag_size: 0.08                                    # Size of the AprilTag in meters (e.g., 0.08 = 8cm)
  families: tag36h11                                # Tag family name (e.g., tag36h11, tag25h9, tagStandard41h12)

  # Image capture settings
  resolution: [1920, 1080]                          # Image resolution in pixels (width, height)
  rotate: 180                                       # Rotation of the image in clockwise degrees (e.g., 0, 90, 180, 270)
  fps: 30                                           # Frames per second of the image capture

  # the viewing angles a base is given (Bases[].camera_angle picks one by name);
  # what a camera at that angle sees travels with its frames to the analyzer
  angle_config:                                     # angle name: what a camera at that angle sees
    "front": "Direct front view at eye level, showing participants face-on"
    "front-top-45": "View from front but elevated at a 45-degree angle, showing a top-down perspective of the workspace and participants"
    "top": "View from above, showing a top-down perspective of the workspace and participants"
    
  # VideoStream settings
  # NOTE: where each base's video comes from ('source' and 'source_index') is in
  # Bases (below). A base with source 'file' names its file by its full path
  # (Browse… on the Config tab). Files replayed together sit in one folder: the
  # replay starts at the latest start among them, read from the names
  # (<prefix>_<timestamp>.<extension>), unless initial_sync_time is set.

  # Frame processing settings (applies to all video sources)
  keyframe_interval: 30.0                          # Interval between processed frames in seconds (30.0 = 1 frame per 30s, 1.0 = 1 FPS)
  processing_rate: 1.0                             # Real-time rate multiplier for file sources (1.0 = real-time, 0.5 = 2x time allowance, 2.0 = half time allowance)
  enable_timing_sync: true                         # Enforce accumulative timing synchronization for file sources (prevents drift and race conditions)
  
  # Examples:
  # For real-time sources (opencv/stream): keyframe_interval controls frame saving frequency
  # keyframe_interval: 30.0 → Save 1 frame every 30 seconds
  # keyframe_interval: 1.0  → Save 1 frame every second (1 FPS)
  #
  # For file sources: keyframe_interval + processing_rate control playback timing
  # keyframe_interval: 30.0, processing_rate: 1.0  → 1 frame per 30s in real-time
  # keyframe_interval: 1.0, processing_rate: 1.0   → 1 FPS in real-time  
  # keyframe_interval: 1.0, processing_rate: 0.5   → 1 FPS with 2x time allowance (2s per frame)
  # keyframe_interval: 10.0, processing_rate: 2.0  → 1 frame per 10s with half time allowance (5s per frame)

  stream_kwargs:
    buffer_duration: 0.08                           # Buffer duration in seconds for video stream
    format: MJPG                                    # Video format (e.g., MJPG, H264)
    resample_method: ResampleMethod.VIDEO_AVERAGE   # Resampling method for video processing
    timestamp_offset: 0.0                           # seconds added to every frame's stamp, for every base of this config: the measured delay of the stream as a negative number (e.g. -0.35), see docs/rtmp_streaming.md#timestamps
  # example 1: external stream (already running; the base pulls read_target, else target)
  # cam-external:
  #   target: rtmp://uber-server.local:1935/vfa/side
  #   read_target: rtsp://uber-server.local:8554/vfa/side
  #
  # example 2: managed stream (TUI starts/stops ffmpeg on a remote Raspberry Pi via SSH)
  # cam-front:
  #   ssh_profile: rpi-front          # must match a TUI SSH profile name
  #   device: /dev/video0             # camera device on the remote machine
  #   target: rtmp://uber-server.local:1935/vfa/front     # publish URL on MediaMTX (rtmp://, rtsp:// or srt://)
  #   read_target: rtsp://uber-server.local:8554/vfa/front  # what the base pulls; empty = target
  #   codec: libx264                  # video codec
  #   resolution: 1920x1080           # video resolution
  #   fps: 30                         # frames per second
  #   bitrate: 1M                     # H.264 bitrate of the stream and of its recording
  #   record: true                    # also keep an mkv on the Pi under ~/artifacts/streams/capture/<date>/<profile>/video/
  # cam-top:
  #   ssh_profile: rpi-top
  #   device: /dev/video0
  #   target: rtmp://uber-server.local:1935/vfa/top
  #   read_target: rtsp://uber-server.local:8554/vfa/top
  #   codec: libx264
  #   resolution: 1920x1080
  #   fps: 30

# bases settings
# Each entry defines one VFA base node (a camera/viewpoint). A base references a
# calibrated camera profile (from Cameras) and a viewing angle. Single source of
# truth for base id, camera, source and angle. Edit the template entry / use
# "+ Add Entry" in the TUI; entries whose id is a <...> placeholder are ignored.
Bases:
  - id: <base-id>               # base id / identity (appears in storage paths {camera}_{id})
    camera: <camera-name>       # calibrated camera profile name (from Cameras)
    source: stream              # source type (opencv/stream/lsl/file; rtmp is the old name of stream)
    source_index: 0             # opencv: camera index; stream: name of a Streams entry; lsl: stream name; file: the file to replay, by its full path (Browse… on the Config tab)
    camera_angle: <camera-angle>  # the viewing angle of this base, by its name in Base.angle_config (front, top, ...)

Synchronizer:
  result_expiry_time: 30                            # cleanup timeout (seconds)
  match_tolerance: 0.5                              # matching tolerance (seconds) for incoming result to time buckets
  actions: true                                     # send every frame set for its action labels (the VLM, the vfa_action event; the server draws tags and gaze lines on the frames for the VLM by its own april_tag / gaze_detect settings, and returns neither as data); the card's Action Labels overrides
  pose: false                                       # send every frame set for its skeletons, AprilTags and head yaws as data (the vfa_features event, one per frame set); the card's Pose overrides
  gaze: false                                       # and for where each person looks, as data (the gaze model's point and target); a gaze needs the pose, so this turns the pose on too; the card's Gaze overrides
  action_interval: 0                                # seconds between two action-label (VLM) requests, whatever the bases' keyframe_interval; 0 asks for every frame set. For a pose run at 1 frame set per second, 30 keeps the VLM at its usual pace
  pose_keypoints: true                              # keep the skeletons in every vfa_features event; false keeps the derived fields alone (smaller events)
  feature_zones_file: <zones-json-file>             # optional: a JSON file of named polygons a gaze may land in, {name: [[x, y], ...]} for every angle or {angle: {name: polygon}}, in pixels or in [0, 1]; relative to this folder


# streams settings
# each entry defines a video stream source. streams with ssh_profile can be started/stopped
# from the TUI Launcher; streams without ssh_profile are treated as external (already running).
Streams:

# Database settings
InfluxDB:
  # Replace <inlfuxdb-example-server> with your actual sever address that runs the InfluxDB server, and the <port>
  # with the actual port number that InfluxDB server is listening to. The default port for InfluxDB is 8086.
  # Replace <influxdb-token> with your actual InfluxDB token, and <org-name> with your actual InfluxDB organization name.
  # =================================================================================
  # e.g., if your InfluxDB server is on uber-server.local machine and its IP address is 192.168.1.12 and listens on 8086,
  # and it has a token named lrn6PxfmD_Sbde1Ke3LL5QOIc-QQJLT9Tw58-Y1pHXWfcsdljWMfwSOJ8F3CP3c20qYPiJ9UL8bSslELPW27lw==
  # and organization named admin, then the following line should be:
  # url: http://uber-server.local:8086
  # token: lrn6PxfmD_Sbde1Ke3LL5QOIc-QQJLT9Tw58-Y1pHXWfcsdljWMfwSOJ8F3CP3c20qYPiJ9UL8bSslELPW27lw==
  # org: admin
  url: http://<influxdb-example-server>:<port>
  token: <influxdb-token>
  org: <org-name>
  bucket: mmla-data

MongoDB:
  url: mongodb://<mongodb-example-server>:<port>
  db: openmmla

# MQTT settings
MQTT:
  # Replace <mqtt-example-server> with your actual sever address that runs the MQTT server, and the <port-number>
  # with the actual port number that MQTT server is listening to. The default port for MQTT is 1883.
  # =================================================================================
  # e.g., if your MQTT server is on uber-server.local machine and its IP address is 192.168.1.12, and it has listening
  # on port 1883, then the following line should be:
  # host: uber-server.local
  # port: 1883
  host: <mqtt-example-server>
  port: <port-number>

# Redis settings
Redis:
  # Replace <redis-example-server> with your actual sever address that runs the Redis server, and the <port-number>
  # with the actual port number that Redis server is listening to. Specify a certain database number you want to use for
  # message queue. The default database number is 0. The default port for Redis is 6379.
  # =================================================================================
  # e.g., if your Redis server is on uber-server.local machine and its IP address is 192.168.1.12, and it has listening
  # on port 6379, then the following line should be:
  # host: uber-server.local
  # port: 6379
  # db: 0
  host: <redis-example-server>
  port: <port-number>
  db: <database-number>

# Gateway (Nginx) settings
# Shared reverse-proxy/load-balancer endpoint that bases connect to. In the
# Server section below, a service may be given either as a bare endpoint name
# (composed against this gateway, e.g. 'vllm' -> {scheme}://{host}:{http_port}/vllm)
# or as a full URL (used as-is, bypassing the gateway for a direct connection).
Gateway:
  host: <gateway-host>      # nginx load balancer host, e.g. uber-server.local
  http_port: 8080           # nginx HTTP reverse-proxy port
  scheme: http              # http or https

# Server settings
Server:
  # VFA server settings
  # Replace <vfa-example-server> with your actual sever address that runs the VFA server or the load balancer
  # that proxy your VFA requests, and the <port> with the port numbers different VFA services listening on
  # or the port number that the load balancer listening on. The default port for VFA services is vllm:5007
  # The default port for load balancer is 8080.
  # =================================================================================
  # e.g., if your VFA server is run on vfa-server.local, and you have a load balancer on uber-server.local that proxy
  # your ASR requests, then the following line could be:
  # request ASR services from load balancer:
  # vfa:
  #   vllm_frame_analyzer: http://uber-server.local:8080/vllm
  # or directly request VFA services from vfa-server:
  # vfa:
  #  vllm_frame_analyzer: http://vfa-server.local:5007/vllm
  vfa:
    vllm_frame_analyzer: http://<vfa-example-server>:<port>/vllm

# Camera intrinsics, one entry per camera, named as a base's `camera` names it.
# IPS Camera Calibration (Capture, then Calibrate) writes an entry; Launcher →
# Calibration Cameras → Sync to Remote gives it to another machine; the Config
# tab adds one by hand (+ Add Camera). An entry looks like this:
#   your-camera:
#     fisheye: false                # true for a fisheye lens
#     params: [fx, fy, cx, cy]      # what the tag detector uses
#     K:                            # 3x3 intrinsic matrix
#       - [fx, 0.0, cx]
#       - [0.0, fy, cy]
#       - [0.0, 0.0, 1.0]
#     D:                            # distortion coefficients (k1, k2, p1, p2, k3)
#       - [k1, k2, p1, p2, k3]
Cameras: {}

# Dashboard backend settings. The TUI fills InfluxDB, MongoDB and Redis from System Settings ->
# Connections when it saves this file; the live camera tiles and live sound find MediaMTX through
# System Settings -> Stream Server (config/system_services.yml). A StreamServer section here (host,
# api_port, playback_port, webrtc_port) is used only when System Settings has none, and without
# either the dashboard tries the InfluxDB host with the MediaMTX default ports.
#
# The ports are not set here: `make flask` binds the Dashboard port of System Settings (DASHBOARD_PORT,
# 5050) and, on the same addresses, the media ports (DASHBOARD_MEDIA_PORTS, the two above it: 5051
# and 5052), from which the Live page loads the recorded videos and sound of a replay. See
# docs/dashboard.md.

# Database settings
InfluxDB:
  # The dashboard reads every measurement it shows from here (sessions, live view, analysis).
  # Replace <inlfuxdb-example-server> with your actual sever address that runs the InfluxDB server, and the <port>
  # with the actual port number that InfluxDB server is listening to. The default port for InfluxDB is 8086.
  # Replace <influxdb-token> with your actual InfluxDB token, and <org-name> with your actual InfluxDB organization name.
  # =================================================================================
  # e.g., if your InfluxDB server is on uber-server.local machine and its IP address is 192.168.1.12 and listens on 8086,
  # and it has a token named lrn6PxfmD_Sbde1Ke3LL5QOIc-QQJLT9Tw58-Y1pHXWfcsdljWMfwSOJ8F3CP3c20qYPiJ9UL8bSslELPW27lw==
  # and organization named admin, then the following line should be:
  # url: http://uber-server.local:8086
  # token: lrn6PxfmD_Sbde1Ke3LL5QOIc-QQJLT9Tw58-Y1pHXWfcsdljWMfwSOJ8F3CP3c20qYPiJ9UL8bSslELPW27lw==
  # org: admin
  url: http://<influxdb-example-server>:<port>
  token: <influxdb-token>
  org: <org-name>
  bucket: mmla-data

MongoDB:
  # Optional and only read: the session documents add each session's devices, streams, IPS camera
  # placement and provenance, and list sessions that have no measurements yet.
  url: mongodb://<mongodb-example-server>:<port>
  db: openmmla

Redis:
  # The analysis report jobs go through this Redis database to the Celery worker (make celery),
  # on the queue mmla-dashboard (environment variable DASHBOARD_CELERY_QUEUE to change it). Without a
  # worker the dashboard computes the report itself.
  # Replace <redis-example-server> with your actual sever address that runs the Redis server, and the <port-number>
  # with the actual port number that Redis server is listening to. Specify a certain database number you want to use for
  # message queue. The default database number is 0. The default port for Redis is 6379. The redis here is for celery
  # workers to receive tasks from the message queue, so we recommend you to use a different database number other than
  # the default 0, like 1 or 2.
  # =================================================================================
  # e.g., if your Redis server is on uber-server.local machine and its IP address is 192.168.1.12, and it has listening
  # on port 6379, then the following line should be:
  # host: uber-server.local
  # port: 6379
  # db: 1
  host: <redis-example-server>
  port: <port-number>
  db: <database-number>

Exports:
  # Raw recordings in the Analysis page's downloads (Data and exports): the camera and microphone files
  # of a session that this machine holds under artifacts/<session>/collection/, and the recordings
  # MediaMTX keeps of its streams. The same switch covers what the Live page plays: a replay's recorded
  # video and sound, and a running session's microphones heard live (their listen/ paths). They are
  # classroom footage and voices of children, and the dashboard serves them over plain HTTP without a
  # login, on its port and its media ports, wherever make flask binds them (the INFRA addresses of
  # docker/.env, else every interface): set false to keep them off the dashboard (MediaMTX itself has
  # no login, so this does not keep them off its own ports). An empty or unknown value, or a
  # config.yml or system_services.yml that cannot be parsed, keeps them off too. Speaker profiles,
  # coding clips and everything else of a session folder
  # are never served. The environment variable DASHBOARD_RAW_MEDIA (0 or 1) overrides this; restart
  # the dashboard after changing either.
  raw_media: true

# MediaMTX configuration for the OpenMMLA stream server.
#
# cameras and microphones publish with FFmpeg to rtmp://<stream-server>:1935/<app>/<name>
# (or srt:// / rtsp://), the bases pull the same path as rtsp://<stream-server>:8554/<app>/<name>,
# and every published stream is also recorded on the server. Started by
# `make mediamtx` in pipelines/uber-server (native) or by docker/docker-compose.infra.yml;
# both read this file. Every key not listed here keeps the MediaMTX default.
# Reference: https://github.com/bluenviron/mediamtx (mediamtx.yml in the release).

logLevel: info

# control API (curl http://<stream-server>:9997/v3/paths/list) and Prometheus metrics
api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998

# playback server: download a time range of a recording,
# e.g. http://<stream-server>:9996/get?path=vfa/front&start=<RFC3339>&duration=60
playback: yes
playbackAddress: :9996

rtsp: yes
rtspAddress: :8554
rtspTransports: [udp, multicast, tcp]
rtmp: yes
rtmpAddress: :1935
srt: yes
srtAddress: :8890
hls: no
webrtc: no

# lab-network defaults: anyone may publish, read and use the API. To require
# credentials, give the users a pass and restrict the api action (see the
# MediaMTX reference); the base configs then need the credentials in the URLs.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

pathDefaults:
  # record every published path; segments are fMP4 files named after their
  # start time. ./recordings is artifacts/recordings of the repository either
  # way: make starts MediaMTX from artifacts/, docker compose mounts the folder
  record: yes
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10m
  # a segment is deleted this long after it began, by MediaMTX itself: take a
  # session's footage (Sessions -> Export Recordings) before then. 0s keeps
  # everything; the Stream Server card's Config tab sets this, and its
  # Recordings tab shows what the server holds
  recordDeleteAfter: 72h

paths:
  # any path name works: the <app>/<name> of the publish URL is created on the fly
  all_others:

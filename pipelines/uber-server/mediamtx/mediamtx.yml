# MediaMTX configuration for the OpenMMLA stream server.
#
# cameras and microphones publish with FFmpeg to rtmp://<stream-server>:1935/<app>/<name>
# (or srt:// / rtsp://), the bases pull the same path as rtsp://<stream-server>:8554/<app>/<name>,
# and the paths of a running session are also recorded on the server. Started by
# `make mediamtx` in pipelines/uber-server (native) or by docker/docker-compose.infra.yml;
# both read this file. Every key not listed here keeps the MediaMTX default.
# Reference: https://github.com/bluenviron/mediamtx (mediamtx.yml in the release).

logLevel: info

# how long a connection may stay silent before the server closes it (MediaMTX's
# default is 10s). The capture hosts reach this server over Tailscale, through a
# DERP relay where no direct path exists, and a relay hiccup can stall a
# publisher's TCP for longer than that: MediaMTX then closed it ("closed: read
# tcp ...: i/o timeout") and the stream was gone until its FFmpeg was started
# again. readTimeout bounds each read from a publisher (RTMP, RTSP over TCP; for
# SRT it is also the peer idle timeout) and the reading of an HTTP request;
# writeTimeout bounds each write to a reader (a base pulling RTSP, a playback
# download, the API's answers), so the server keeps a reader behind the same
# relay through such a stall too (a video base reopens its own pull after 10 s
# without a frame, and a capture host its push after 15 s blocked). The price: a publisher that vanished without
# closing its connection (a Pi that lost power or its network) keeps its path
# listed as ready, with nothing arriving, until readTimeout runs out. MediaMTX
# applies a change to either only by closing every connection, publishers and
# readers alike, so change them between sessions (docs/rtmp_streaming.md)
readTimeout: 30s
writeTimeout: 30s

# control API (curl http://<stream-server>:9997/v3/paths/list) and Prometheus metrics
api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998

# playback server: download a time range of a recording,
# e.g. http://<stream-server>:9996/get?path=vfa/front&start=<RFC3339>&duration=60
playback: yes
playbackAddress: :9996

rtsp: yes
rtspAddress: :8554
rtspTransports: [udp, multicast, tcp]
rtmp: yes
rtmpAddress: :1935
srt: yes
srtAddress: :8890
hls: no

# WebRTC, for browsers only: the dashboard's camera tiles read a live path with
# WHEP (POST http://<stream-server>:8889/<app>/<name>/whep). The handshake goes
# over 8889/tcp and the video over ICE on 8189 (udp, else tcp), so both have to
# be reachable from the browser. H.264 video plays; AAC audio paths do not
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# the addresses the server offers browsers to take the video from are those of
# its own interfaces. inside docker those are the container's, which no browser
# reaches, so docker/docker-compose.infra.yml sets this list from
# MEDIAMTX_WEBRTC_HOSTS (env MTX_WEBRTCADDITIONALHOSTS, comma-separated): the
# address or name browsers reach this host at, such as its tailnet IP
webrtcAdditionalHosts: []

# lab-network defaults: anyone may publish, read and use the API. To require
# credentials, give the users a pass and restrict the api action (see the
# MediaMTX reference); the base configs then need the credentials in the URLs.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

pathDefaults:
  # useAbsoluteTimestamp: yes would keep the clock an RTSP publisher sends (RTCP sender reports)
  # instead of stamping frames as they arrive here; RTMP and SRT publishers carry no clock. Off,
  # because with it on an RTSP path publishes nothing until the first sender report arrives
  # (the log says "received RTP packet without absolute time, skipping it") and its recordings
  # are then filed by the publisher's clock, which Sessions -> Export Streams matches against
  # the session's window: only for a path whose publisher is NTP-synchronized, and per path
  # (paths: <name>: useAbsoluteTimestamp: yes), see docs/rtmp_streaming.md#timestamps
  # no path is recorded by default. A camera may publish around the clock and
  # is shared by the sessions that pull it, so the server keeps only the time a
  # session ran: START (Session Control in the TUI, mmla ses-ctl)
  # switches record on for the paths the session's bases pull, each in a named
  # path entry it adds through the control API, and STOP removes those entries
  # again (openmmla/utils/stream_recording.py). Per path and never here, so two
  # sessions in two rooms do not touch each other. The API changes the running
  # server only: restarted mid-session, it records nothing until the next START,
  # and neither does it after it reads this file again, which MediaMTX does
  # whenever the file changes (it drops the entries the API added). A Save or a
  # Sync on the Stream Server card's Config tab switches the running sessions'
  # paths on again a few seconds later; after any other change, send START again.
  # yes records every published path, sessions or not.
  # segments are fMP4 files named after their start time. ./streams/server is
  # artifacts/streams/server of the repository either way: make starts MediaMTX
  # from artifacts/, and docker compose mounts that folder at /streams/server of
  # the container, whose ./ is /
  record: no
  recordPath: ./streams/server/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10m
  # a segment is deleted this long after it began, by MediaMTX itself: take a
  # session's footage (Sessions -> Export Recordings) before then. 0s keeps
  # everything; the Stream Server card's Config tab sets this, and its
  # Recordings tab shows what the server holds
  recordDeleteAfter: 72h

paths:
  # any path name works: the <app>/<name> of the publish URL is created on the fly
  all_others:

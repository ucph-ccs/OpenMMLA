# config_template.yml
# Template configuration file for video frame analyzer pipeline components.
# Fill in or update values as needed for your environment.
VLLMFrameAnalyzer:
  port: 5007 # port number
  workers: 1 # number of workers

  families: tag36h11  # AprilTag used in experiment, e.g., tag36h11, tag25h9, tagStandard41h12
  gaze_backend: page  # the gaze model behind the gaze lines and the features' gazes: page (PaGE, human-level on the gaze benchmarks) or gazelle (Gaze-LLE from torch.hub)
  gaze_head_scale: 1.3  # page only: the face box widened about its centre into the head crop the model looks at (it learned from head boxes, the face detector answers face boxes); 1 crops the face box as is
  gaze_model: <gaze-checkpoint>  # its checkpoint; left out, the backend's default. page: Octopus1/page-vitb (default), Octopus1/page-vits (a third of the compute), Octopus1/page-vitsplus, Octopus1/page-vithplus (the 840M teacher). gazelle: gazelle_dinov2_vitl14_inout (default), gazelle_dinov2_vitb14_inout. A checkpoint loads with its own backend only: a gazelle_* one needs gaze_backend: gazelle
  gaze_head_box_fallback: true  # features endpoint: a person the face detector missed gets a head box from the pose's head keypoints (nose, eyes, ears) for the gaze model; false leaves such persons' gaze unknown
  gaze_face_detector_bgr: true  # hands RetinaFace the frame in BGR, the channel order it expects, where it finds more faces at the same speed; false hands it RGB, which changes the gazes and the tracker's face check

  backend: vllm  # the VLM behind the action labels, with its block below: vllm (the console's MLLM Server card, the default; left out, vllm too), ollama, llamacpp (self-hosted), or openai, gemini, qwen, deepseek, grok, zhipuai, intern (cloud APIs: the frames are uploaded)
  end_to_end: false # whether to use end-to-end mode (true) or two-step mode (false)
  image_detail: "auto"  # Image detail for vision models: "low" (faster, less detail), "high" (slower, more detail), "auto" (model decides)
  prompt_profile: cot  # end-to-end prompt variant: cot (zero-shot CoT, paper default), baseline, baseline_no_pre
  # action_schema: collaboration_v1  # optional explicit override; otherwise use config/vfa/action_schemas.yml default_schema

  # POST /vllm/features: the persons of a frame as skeletons (a YOLO pose model), the AprilTag each wears, their head yaw and their gaze (the gaze model above), as geometry; no VLM
  features:
    enabled: true  # answer /vllm/features; false makes it answer 503
    pose_model: yolo26n-pose.pt  # an Ultralytics pose weights file (yolo26n/s/m-pose.pt, yolo11n-pose.pt ...): a bare name or a relative path lives under weights_dir (a bare name is fetched there once, at start); an absolute path is used as it is. Note: ultralytics is AGPL-3.0, see the Docker guide
    weights_dir: weights  # where the pose weights live, relative to this folder (the container's /project, so they survive a rebuild)
    pose_confidence: 0.25  # a person below this detection confidence is left out
    keypoint_confidence: 0.3  # a keypoint below this confidence counts as hidden (head yaw, torso, hands)
    inout_threshold: 0.5  # a gaze the gaze model puts in the frame with less than this probability is out_of_frame; a request may name its own
    gaze: true  # answer the gazes with the features (the gaze model); false answers the pose alone, and a request may ask either way
    tracking:  # a track id per person across the frames of one camera (ByteTrack over the pose boxes), so a tag hidden for a while keeps naming its person; needs the request's cameras (the synchronizer sends its base ids) and one worker, as the tracks live in the process
      enabled: true  # false answers without track ids, every frame standing alone
      buffer_frames: 30  # frames a person out of view keeps their track and tag: at the bases' keyframe_interval 1.0 that is 30 s
      idle_seconds: 600  # a camera not heard from for this long forgets its tracks, and a session whose cameras all did forgets its tag galleries
      split_gap_seconds: 3.0  # a lost track found again sooner keeps its id and tag; one found after this long continues under a new track id, without its tag, when appearance.split_on says so (3: two missed frame sets at one a second); 0 never splits
      frame_seconds: 1.0  # the time between two frames of a camera (the bases' keyframe_interval), which turns split_gap_seconds into frames
      cascade: false  # true: the tracks in view take the frame's persons first and a lost track gets only a person none of them took (it keeps a robbed person on their own track, but swapped more persons between tracks in view in a replay of recorded classroom sessions)
      freeze_lost: false  # true: a lost track stays where its person was last seen instead of moving on at its last velocity (it added errors in the same replay)
      appearance:  # what the checks compare: kept in this process's memory only, per session, never written, logged or answered (an answer carries a kind, a distance and a verdict)
        descriptor_frames: 10  # a track keeps its last this many looks, sample_spacing_seconds apart
        gallery_size: 10  # a tag's gallery (frames where it was read on the torso) keeps this many faces, and this many colours per camera
        sample_spacing_seconds: 2.0  # the looks a track or a tag keeps of one camera are at least this far apart
        split_on: different  # which verdict splits a lost track found again after split_gap_seconds: different (the face calls the person someone else; as such a match is refused in the first place, and the lost track then takes only a person the appearance confirms for 3 frames, the person starts a track of their own) or unconfirmed (any verdict but same, none included; most re-found tracks have no face to compare, so this splits many that hold the same person)
        tag_check_acts: false  # true: a remembered tag the person is called someone else than is withheld under a provisional id, and different_frames such verdicts in a row continue the track under that id; false only records the verdict in reid, as a different against a tag's gallery is often wrong
        different_frames: 2  # with tag_check_acts: a track in view whose person is called someone else than its remembered tag this many frames in a row continues under a new id; before that the tag is withheld and the person answered under a provisional id (the one the track then continues under), so the fusion carries no tag onto them either
        max_overlap: 0.3  # a person whose box overlaps another's by this IoU or more adds no colour to a track's or tag's looks
        colour:  # the upper-body clothing: an HSV histogram over the torso, compared by its Hellinger distance (0 for the same) against the same camera's looks
          enabled: false  # off: lighting, posture and occlusion move the histogram as much as a change of person, so its 'different' verdicts are unreliable; true switches it on
          same: 0.12  # at or below: the same person (a tag only when it is also the nearest tag)
          different: 0.35  # above: someone else; in between, unknown
        face:  # an ArcFace embedding (InsightFace) of the face aligned from RetinaFace's five landmarks, compared by its cosine distance; where both sides have a usable face it decides, not the colour
          enabled: false  # local face recognition: switch it on only where the participants' consent covers it
          same: 0.55  # at or below: the same person (a tag only when it is also the nearest tag)
          different: 0.65  # above: someone else; in between, unknown
          min_face_px: 56  # a narrower face box is not used
          max_face_yaw: 50  # nor a face turned further than this many degrees by its landmarks (50: the nose 0.6 eye distances off the eyes' midpoint)
          recognition_model: weights/face/w600k_r50.onnx  # relative to this folder (the container's /project)
          detection_model: ""  # SCRFD (weights/face/det_10g.onnx) for the landmarks of a person RetinaFace missed, looked for in the pose's head box; empty: none, as such faces separated poorly
          models_url: https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip  # fetched once, at start, when a model file is missing (InsightFace's models are for non-commercial research only); empty never fetches

  # Supported backends
  ollama:
    api_key: <OLLAMA_API_KEY>
    vlm_base_url: "http://host.docker.internal:11434/v1"  # Ollama on the frame analyzer's own host (http://localhost:11434/v1 when it runs without Docker)
    llm_base_url: "http://host.docker.internal:11434/v1"
    vlm_model: "llava:13b" # vlm model name
    llm_model: "llama3.1" # llm model name
    top_p: 0 # top_p for LLM (from 0 to 1) - OPTIONAL: omit if model doesn't support it
    temperature: 0 # temperature for LLM (from 0 to 1) - OPTIONAL: omit if model doesn't support it
    VLMExtraBody: {} # extra body for vlm
    LLMExtraBody: {} # extra body for llm

  vllm:  # the console's MLLM Server card (vllm serve, config/mllm_server.yml): one model on port 8010 serves both steps; its limit_mm_per_prompt must cover the cameras of a frame set, which go in one request
    api_key: EMPTY  # its --api-key; a vllm, ollama or llamacpp block may leave the key out (EMPTY is sent)
    vlm_base_url: "http://host.docker.internal:8010/v1"  # host.docker.internal: the frame analyzer's container reaching its own host; http://localhost:8010/v1 when it runs without Docker, http://<host>:8010/v1 for another machine
    llm_base_url: "http://host.docker.internal:8010/v1"
    vlm_model: "Qwen/Qwen3-VL-8B-Instruct"
    llm_model: "Qwen/Qwen3-VL-8B-Instruct"
    VLMExtraBody: {}
    LLMExtraBody: {}
  
  llamacpp:
    api_key: "sk-no-key-required"
    vlm_base_url: "http://host.docker.internal:8001/v1"  # a llama.cpp server on the frame analyzer's own host (http://localhost:8001/v1 when it runs without Docker)
    llm_base_url: "http://host.docker.internal:8001/v1"
    vlm_model: "ggml-org/SmolVLM-500M-Instruct-GGUF"
    llm_model: "ggml-org/SmolVLM-500M-Instruct-GGUF"
    VLMExtraBody: {}
    LLMExtraBody: {}

  openai:
    api_key: <OPENAI_API_KEY>
    vlm_model: "gpt-4o"
    llm_model: "gpt-4o"

  gemini:
    api_key: <GEMINI_API_KEY>
    vlm_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    llm_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    vlm_model: "gemini-2.0-pro-exp-02-05"
    llm_model: "gemini-2.0-pro-exp-02-05"

  grok:
    api_key: <GROK_API_KEY>
    vlm_base_url: "https://api.x.ai/v1"
    llm_base_url: "https://api.x.ai/v1"
    vlm_model: grok-4-latest 
    llm_model: grok-4-latest

  deepseek:
    api_key: <DEEPSEEK_API_KEY>
    vlm_base_url: "https://api.deepseek.com"
    llm_base_url: "https://api.deepseek.com"
    vlm_model: "deepseek-reasoner"
    llm_model: "deepseek-reasoner"
  
  qwen:
    api_key: <QWEN_API_KEY>
    vlm_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    llm_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    vlm_model: "qwen2.5-72b-instruct"
    llm_model: "qwen2.5-72b-instruct"
  
  zhipuai:
    api_key: <ZHIPU_API_KEY>
    vlm_model: "glm-4.5v"
    llm_model: "glm-4.5v"
  
  intern:
    api_key: <INTERN_API_KEY>
    vlm_base_url: "https://chat.intern-ai.org.cn/api/v1/"
    llm_base_url: "https://chat.intern-ai.org.cn/api/v1/"
    vlm_model: "internvl3.5-241b-a28b"
    llm_model: "internvl3.5-241b-a28b"

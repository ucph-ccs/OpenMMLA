site_name: OpenMMLA
site_description: An IoT-based multimodal data collection toolkit for learning analytics
site_url: https://openmmla.readthedocs.io/
repo_url: https://github.com/ucph-ccs/OpenMMLA
repo_name: ucph-ccs/OpenMMLA
edit_uri: edit/main/docs/
copyright: MIT License

docs_dir: docs
# the pip requirements for this site are not a page, and some local pages are kept out of the site
exclude_docs: |
  requirements.txt
  paper.md
  analytics/interaction_classifier.md
  analytics/coding_and_audit.md
  analytics/transcription_guide.md
  img/interaction_*.svg
  STYLE.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # index.md pulls in the repository README so the landing page has one source
  - include-markdown

nav:
  - Overview: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - System prerequisites: prerequisites.md
      - System services: system_services.md
      - Management console (TUI):
          - Overview: tui/index.md
          - Environment tab: tui/environment.md
          - Launcher tab: tui/launcher.md
          - System Settings: tui/system-settings.md
          - System Services: tui/system-services.md
          - Collection: tui/collection.md
          - Bringing recordings in: tui/session-tools.md
          - Pipelines: tui/pipelines.md
          - Streams tab: tui/streams.md
          - Sessions tab: tui/sessions.md
          - Status tab: tui/status.md
  - Pipelines:
      - Automatic speech recognition (ASR):
          - Overview: pipelines/asr/index.md
          - Run: pipelines/asr/run.md
          - Speakers and diarization: pipelines/asr/speakers-and-diarization.md
          - Configuration: pipelines/asr/configuration.md
      - Indoor positioning (IPS):
          - Overview: pipelines/ips/index.md
          - Run: pipelines/ips/run.md
          - Calibrate the cameras: pipelines/ips/calibration.md
          - Configuration: pipelines/ips/configuration.md
      - Video frame analyzer (VFA):
          - Overview: pipelines/vfa/index.md
          - Run: pipelines/vfa/run.md
          - Action labels: pipelines/vfa/action-labels.md
          - Pose and gaze: pipelines/vfa/pose-and-gaze.md
          - Configuration: pipelines/vfa/configuration.md
          - Human coding interface: pipelines/vfa/coding_interface.md
  - Analysis:
      - Window features: analytics/window_features.md
  - Deployment:
      - Docker: docker.md
      - Dashboard:
          - Overview: dashboard/index.md
          - Live video and sound: dashboard/live-video-and-sound.md
          - Deploy: dashboard/deploy.md
          - Reference: dashboard/reference.md
      - Nginx: nginx.md
      - Streaming (MediaMTX):
          - Overview: streaming/index.md
          - Recording: streaming/recording.md
          - Troubleshooting: streaming/troubleshooting.md
      - Raspberry Pi: raspi_config.md
  - Reference:
      - Databases: database.md
      - FAQ: faq.md

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 700; fill: #222; }
      .t { font-size: 12.5px; fill: #333; }
      .s { font-size: 11px; fill: #666; }
      .col { font-size: 13px; font-weight: 700; fill: #888; letter-spacing: 1px; }
      .box { fill: #fff; stroke: #999; stroke-width: 1.2; rx: 8; }
      .asr { fill: #eef6ff; stroke: #4a7fc1; }
      .ips { fill: #eefbf1; stroke: #3f9d5a; }
      .vfa { fill: #fff4e8; stroke: #d98a2b; }
      .fuse { fill: #f5f0ff; stroke: #7b5fc7; }
      .gt { fill: #fff0f3; stroke: #c94f6d; }
      .arrow { stroke: #555; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="820" fill="#fafafa"/>
  <text x="700" y="34" text-anchor="middle" class="h" font-size="19">OpenMMLA: from classroom sensors to a collaboration state every 10 s</text>

  <!-- column titles -->
  <text x="130" y="72" text-anchor="middle" class="col">SENSORS</text>
  <text x="430" y="72" text-anchor="middle" class="col">PIPELINES (events in InfluxDB)</text>
  <text x="880" y="72" text-anchor="middle" class="col">WINDOW FEATURES (mmla ses-fuse, 10 s)</text>
  <text x="1245" y="72" text-anchor="middle" class="col">PREDICTION</text>

  <!-- sensors -->
  <rect x="40" y="95" width="205" height="120" class="box"/>
  <text x="142" y="118" text-anchor="middle" class="h">Microphones</text>
  <text x="52" y="140" class="t">group mic (Jabra)</text>
  <text x="52" y="158" class="t">per-person mics (badge, Vimo)</text>
  <text x="52" y="176" class="s">only where enrolled; the model</text>
  <text x="52" y="190" class="s">uses the group mic alone</text>

  <rect x="40" y="245" width="205" height="150" class="box"/>
  <text x="142" y="268" text-anchor="middle" class="h">Cameras</text>
  <text x="52" y="290" class="t">1 to 4 Logitech C920</text>
  <text x="52" y="308" class="t">on Raspberry Pi 4 / 5</text>
  <text x="52" y="326" class="t">AprilTag badges (6 to 8 cm)</text>
  <text x="52" y="350" class="s">live: MediaMTX stream server</text>
  <text x="52" y="364" class="s">offline: Collection recordings,</text>
  <text x="52" y="378" class="s">source: file replay</text>

  <!-- pipelines -->
  <rect x="290" y="95" width="280" height="120" class="box asr"/>
  <text x="430" y="118" text-anchor="middle" class="h">ASR</text>
  <text x="302" y="140" class="t">WhisperX transcription (Danish/English)</text>
  <text x="302" y="158" class="t">pyannote anonymous diarization</text>
  <text x="302" y="176" class="t">no voice profiles, no enrollment</text>
  <text x="302" y="198" class="s">events: asr_recognition (3 s), asr_transcription</text>

  <rect x="290" y="245" width="280" height="110" class="box ips"/>
  <text x="430" y="268" text-anchor="middle" class="h">IPS</text>
  <text x="302" y="290" class="t">AprilTag positions from each camera,</text>
  <text x="302" y="308" class="t">fused through transform matrices (base ids)</text>
  <text x="302" y="326" class="t">facing graph between badges</text>
  <text x="302" y="346" class="s">events: ips_translation (1 s), ips_relation</text>

  <rect x="290" y="385" width="280" height="150" class="box vfa"/>
  <text x="430" y="408" text-anchor="middle" class="h">VFA</text>
  <text x="302" y="430" class="t">features endpoint, 1 fps, per camera:</text>
  <text x="302" y="448" class="t">YOLO26 pose, PaGE gaze, tag-in-torso id,</text>
  <text x="302" y="466" class="t">head yaw, gaze target, pairwise geometry</text>
  <text x="302" y="488" class="t">VLM action labels every 30 s (optional)</text>
  <text x="302" y="510" class="s">events: vfa_features, vfa_action</text>
  <text x="302" y="526" class="s">frames of all angles pooled per window</text>

  <!-- features -->
  <rect x="640" y="95" width="480" height="120" class="box asr"/>
  <text x="652" y="116" class="h">Speech</text>
  <text x="652" y="138" class="t">speech_ratio, silence_ratio, n_spurts, mean_spurt_seconds, words</text>
  <text x="652" y="156" class="t">dia_speakers, dia_switches, dia_overlap_ratio, dia_share_entropy</text>
  <text x="652" y="174" class="t">spk_&lt;name&gt;_ratio  (only with enrolled speakers)</text>
  <text x="652" y="200" class="s">how much talk, how many voices, how evenly, how much overlap</text>

  <rect x="640" y="245" width="480" height="110" class="box ips"/>
  <text x="652" y="266" class="h">Space</text>
  <text x="652" y="288" class="t">p&lt;tag&gt;_present_ratio, p&lt;tag&gt;_path_m</text>
  <text x="652" y="306" class="t">pair_dist_min_m, pair_dist_mean_m</text>
  <text x="652" y="324" class="t">pair_face_ab_ratio, pair_face_ba_ratio, pair_face_mutual_ratio</text>
  <text x="652" y="344" class="s">who is where, who moves, who faces whom  (needs 2+ calibrated cameras)</text>

  <rect x="640" y="385" width="480" height="150" class="box vfa"/>
  <text x="652" y="406" class="h">Body, gaze and action</text>
  <text x="652" y="428" class="t">p&lt;tag&gt;_yaw_mean / yaw_abs_mean / yaw_std, p&lt;tag&gt;_wrist_speed, p&lt;tag&gt;_gaze_switches</text>
  <text x="652" y="446" class="t">p&lt;tag&gt;_gaze_{partner_face | own_hands | partner_hands | zone | elsewhere | out_of_frame}_ratio</text>
  <text x="652" y="464" class="t">pair_hand_dist_min / mean, pair_gaze_dist_mean, pair_joint_attention_ratio, pair_mutual_gaze_ratio</text>
  <text x="652" y="482" class="t">p&lt;tag&gt;_action (VLM), pair_co_manipulating</text>
  <text x="652" y="508" class="s">where each person looks and how much they move; whether two look at one thing or at each other</text>
  <text x="652" y="524" class="s">covariates: n_vfa_angles, n_vfa_features, n_ips, n_asr_*</text>

  <!-- prediction -->
  <rect x="1170" y="95" width="200" height="200" class="box fuse"/>
  <text x="1270" y="118" text-anchor="middle" class="h">Late fusion</text>
  <text x="1182" y="140" class="t">one row per 10 s window</text>
  <text x="1182" y="158" class="t">rule baseline</text>
  <text x="1182" y="176" class="t">logistic regression / GBM</text>
  <text x="1182" y="194" class="t">HMM smoothing over time</text>
  <text x="1182" y="220" class="s">ablations: drop a modality,</text>
  <text x="1182" y="234" class="s">change the window (5 / 10 / 30 s)</text>
  <text x="1182" y="256" class="s">train 2024-12 to 2026-03 (LOSO),</text>
  <text x="1182" y="270" class="s">test 2026-05/06, two tasks</text>

  <rect x="1170" y="325" width="200" height="120" class="box fuse"/>
  <text x="1270" y="348" text-anchor="middle" class="h">Targets</text>
  <text x="1182" y="372" class="t">Layer A, 10 s, the group:</text>
  <text x="1182" y="390" class="t">individual/parallel · social ·</text>
  <text x="1182" y="408" class="t">collaborative interaction</text>
  <text x="1182" y="432" class="t">Layer B, 60 s, per person: role</text>

  <rect x="1170" y="475" width="200" height="60" class="box gt"/>
  <text x="1270" y="498" text-anchor="middle" class="h">Ground truth</text>
  <text x="1182" y="520" class="t">human coding (ses-code), κ</text>

  <!-- arrows sensors -> pipelines -->
  <path d="M245,155 L290,155" class="arrow"/>
  <path d="M245,300 L290,300" class="arrow"/>
  <path d="M245,330 C270,330 265,460 290,460" class="arrow"/>
  <!-- pipelines -> features -->
  <path d="M570,155 L640,155" class="arrow"/>
  <path d="M570,300 L640,300" class="arrow"/>
  <path d="M570,460 L640,460" class="arrow"/>
  <!-- features -> fusion -->
  <path d="M1120,155 L1170,155" class="arrow"/>
  <path d="M1120,300 C1145,300 1145,190 1170,190" class="arrow"/>
  <path d="M1120,460 C1150,460 1150,230 1170,230" class="arrow"/>
  <!-- fusion -> targets, ground truth -> targets -->
  <path d="M1270,295 L1270,325" class="arrow"/>
  <path d="M1270,475 L1270,445" class="arrow"/>

  <!-- bottom note -->
  <rect x="40" y="580" width="1330" height="200" class="box" stroke-dasharray="4 3"/>
  <text x="52" y="604" class="h">Timing and identity</text>
  <text x="52" y="628" class="t">Every event carries a unix timestamp; the fusion table joins ASR (3 s buckets), IPS (1 s) and VFA (1 s) by time into 10 s windows. Recordings of a session are cut to one common start;</text>
  <text x="52" y="646" class="t">clocks are NTP-synchronized and camera tracks were aligned to the microphones by audio cross-correlation (ses-align), so modalities agree to well under a second.</text>
  <text x="52" y="672" class="t">Identity: an AprilTag badge (tag id) ties a body, a position and a gaze to a person across cameras; speech stays anonymous (diarized speakers, no names) unless a session enrolled voices.</text>
  <text x="52" y="698" class="t">Corpus: 21 sessions, 2024-12 to 2026-06, two tasks (micro:bit, microscope), one class per session; 17 for training and model selection, 4 held out in time as the test set.</text>
  <text x="52" y="730" class="s">Colour: blue = speech, green = space, orange = body/gaze/action, purple = fusion and targets, red = human coding. Feature names are the columns of the window table.</text>
  <text x="52" y="748" class="s">ASR = automatic speech recognition, IPS = indoor positioning, VFA = video frame analysis, LOSO = leave-one-session-out, GBM = gradient boosting, HMM = hidden Markov model.</text>
</svg>

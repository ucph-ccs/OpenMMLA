[build-system]
requires = [ "setuptools>=45", "wheel", "Cython>=3.0.0",]
build-backend = "setuptools.build_meta"

[project]
name = "openmmla"
version = "0.2.0"
description = "OpenMMLA: A unified multimedia platform integrating audio and vision modules for analysis and computer aided instruction."
readme = "README.pypi.md"
classifiers = [ "Topic :: Multimedia :: Sound/Audio", "Topic :: Multimedia :: Video", "Topic :: Education :: Computer Aided Instruction (CAI)", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3.10", "License :: OSI Approved :: MIT License",]
requires-python = ">=3.10"
dependencies = []
[[project.authors]]
name = "Zaibei Li"
email = "zali@di.ku.dk"

[project.license]
text = "MIT License"

[project.optional-dependencies]
asr-base = [ "cryptography>=42.0.0", "influxdb-client==1.44.0", "jiwer==3.0.4", "librosa==0.10.2.post1", "llvmlite==0.43.0", "matplotlib==3.9.2", "networkx==3.3", "paho-mqtt==2.1.0", "pandas==2.2.2", "PyAudio>=0.2.14", "pydub==0.25.1", "pyecharts==2.0.6", "pymongo>=4.6.0", "pyyaml==6.0.2", "redis==5.0.7", "tqdm==4.67.1",]
asr-server-nemo = [ "azure-cognitiveservices-speech==1.36.0", "cryptography>=42.0.0", "Cython==3.0.11", "dashscope==1.25.15", "denoiser-compat==0.1.5.dev0", "flask==3.0.3", "gevent==24.2.1", "googletrans==3.0.0", "gunicorn==23.0.0", "huggingface_hub==0.23.5", "modelscope[framework]==1.16.1", "nemo-toolkit[asr]<=1.23.0", "onnxruntime==1.18.1", "openai-whisper==20231117", "pandas==2.2.2", "pyyaml==6.0.2", "rotary-embedding-torch==0.6.4", "silero-vad==5.1.2", "speechbrain==1.0.0", "transformers==4.33.3", "whisperx==3.3.1",]
# wespeaker is not on PyPI and PyPI rejects direct URL dependencies, so it is installed separately
# (the docker image and docs pin it):
#   pip install "wespeaker @ git+https://github.com/wenet-e2e/wespeaker.git@9ce7995648a281ba6ce6f4e7a33941672ef22779"
asr-server-wespeaker = [ "accelerate", "azure-cognitiveservices-speech==1.36.0", "cryptography>=42.0.0", "dashscope==1.25.15", "denoiser-compat==0.1.5.dev0", "fire==0.4.0", "flake8==3.8.2", "flake8-bugbear", "flake8-comprehensions", "flake8-executable", "flake8-pyi==20.5.0", "flask==3.0.3", "gevent==24.2.1", "googletrans==3.0.0", "gunicorn==23.0.0", "h5py", "hdbscan>=0.8.40", "huggingface_hub==0.23.5", "importlib-metadata", "kaldiio==2.17.2", "librosa", "lmdb==1.3.0", "matplotlib==3.5.1", "mccabe", "modelscope[framework]==1.16.1", "numpy==1.22.4", "onnxruntime", "openai-whisper", "pandas==2.2.2", "peft", "pre-commit==3.5.0", "pycodestyle==2.6.0", "pyflakes==2.2.0", "pypeln==0.4.9", "PyYAML==6.0", "rotary-embedding-torch==0.6.4", "s3prl==0.4.18", "scikit-learn", "scipy==1.10.0", "setuptools<=81.0.0", "silero-vad", "soundfile", "speechbrain==1.0.0", "tableprint==0.9.1", "torch==2.4.1", "torchaudio==2.4.1", "tqdm==4.66.3", "transformers>=4.43,<5", "umap-learn==0.5.6", "whisperx==3.3.1"]
ips-base = [ "cryptography>=42.0.0", "influxdb-client==1.44.0", "matplotlib==3.9.2", "networkx==3.3", "opencv-python==4.10.0.84", "paho-mqtt==2.1.0", "pandas==2.2.2", "pupil_apriltags==1.0.4.post11", "pyecharts==2.0.6", "pymongo>=4.6.0", "pyyaml==6.0.2", "redis==5.0.7", "scipy==1.14.0",]
vfa-base = [ "cryptography>=42.0.0", "influxdb-client==1.44.0", "matplotlib==3.9.2", "opencv-python==4.10.0.84", "paho-mqtt==2.1.0", "pandas==2.2.2", "pymongo>=4.6.0", "pyyaml==6.0.2", "redis==5.0.7", "requests==2.32.3", "scipy==1.14.0",]
vfa-server = [ "cryptography>=42.0.0", "flask==3.0.3", "gevent==24.2.1", "gunicorn==22.0.0", "huggingface-hub==0.24.6", "matplotlib==3.9.2", "numpy==1.26.4", "openai==1.73.0", "opencv-python==4.10.0.84", "Pillow==10.4.0", "pupil_apriltags==1.0.4.post11", "pyyaml==6.0.2", "retina-face==0.0.17", "scikit-learn==1.6.1", "tf-keras==2.19.0", "timm==1.0.15", "torch==2.7.0", "torchvision==0.22.0",]
vfa-vllm-runtime = [ "qwen-vl-utils==0.0.14", "transformers>=4.57.0", "vllm>=0.11.0",]

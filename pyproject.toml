uber-server = [ "celery[redis]==5.4.0", "flask-cors==4.0.1", "flask-socketio==5.3.6", "flask==3.0.3", "gevent==24.2.1", "gunicorn==23.0.0", "influxdb_client==1.44.0", "matplotlib==3.9.2", "networkx==3.3", "numpy==2.1.0", "pandas==2.2.2", "pyecharts==2.0.6", "pyyaml==6.0.2", "scipy==1.14.0",]
tui = [ "cryptography>=42.0.0", "influxdb-client==1.44.0", "pymongo>=4.6.0", "redis==5.0.7", "textual>=0.80.0", "pyyaml==6.0.2",]

[project.urls]
Homepage = "https://github.com/ucph-ccs/openmmla"

[project.scripts]
openmmla = "openmmla.cli:main"
mmla = "openmmla.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmla*"]

[tool.setuptools.package-data]
# the TUI stylesheet must ship in the wheel; setuptools only bundles .py files by default
"openmmla.tui" = ["styles/*.tcss"]

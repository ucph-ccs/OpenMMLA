[build-system]
requires = [ "setuptools>=45", "wheel", "Cython>=3.0.0",]
build-backend = "setuptools.build_meta"

[project]
name = "openmmla"
version = "0.1.1"
description = "OpenMMLA: A unified multimedia platform integrating audio and vision modules for analysis and computer aided instruction."
readme = "README.md"
classifiers = [ "Topic :: Multimedia :: Sound/Audio", "Topic :: Multimedia :: Video", "Topic :: Education :: Computer Aided Instruction (CAI)", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "License :: OSI Approved :: MIT License",]
requires-python = ">=3.9.0"
dependencies = []
[[project.authors]]
name = "Zaibei Li"
email = "zali@di.ku.dk"

[project.license]
text = "MIT License"

[project.optional-dependencies]
